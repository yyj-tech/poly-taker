<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手动下单</title>
<style>
:root { --bg:#0c0f14; --card:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --green:#3fb950; --red:#f85149; --blue:#388bfd; --off:#3d444d; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
.top { padding: 24px 28px 8px; }
.top h1 { margin: 0; font-size: 22px; }
.top p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.wrap { padding: 16px 28px 40px; max-width: 880px; }
.empty { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 48px 28px; text-align: center; }
.empty h2 { margin: 0 0 10px; font-size: 28px; }
.empty p { margin: 0; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
.match { font-size: 26px; font-weight: 700; margin: 0 0 6px; }
.kick { color: var(--muted); margin: 0 0 16px; }
.fills { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.box { background: #0c0f14; border: 1px solid var(--green); border-radius: 12px; padding: 16px; }
.box.over { border-color: var(--red); }
.box label { display: block; color: var(--muted); margin-bottom: 8px; }
.box input { width: 100%; background: transparent; border: 0; color: var(--text); font-size: 36px; font-weight: 700; outline: none; font-variant-numeric: tabular-nums; }
.warn { color: var(--red); font-size: 14px; margin: 10px 0 0; min-height: 1.2em; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
.stat { background: #0c0f14; border-radius: 12px; padding: 12px; }
.stat span { color: var(--muted); font-size: 13px; }
.stat b { display: block; font-size: 22px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="top">
  <h1>手动下单</h1>
  <p>人填两边要买多少，机器人不会替你下单</p>
</div>
<div class="wrap">
  <div class="empty" id="empty">
    <h2>现在没有</h2>
    <p>现在没有利率大于 0 的真实机会，有了会出在这里</p>
  </div>
  <div class="card hidden" id="card">
    <div class="match" id="match"></div>
    <div class="kick" id="kick"></div>
    <div class="fills">
      <div class="box" id="boxD">
        <label id="labD">庄买多少</label>
        <input id="inpD" inputmode="decimal">
      </div>
      <div class="box" id="boxS">
        <label id="labS">PM 买多少</label>
        <input id="inpS" inputmode="decimal">
      </div>
    </div>
    <div class="warn" id="warn"></div>
    <div class="stats">
      <div class="stat"><span>成本</span><b id="nCost">—</b></div>
      <div class="stat"><span>预留费</span><b id="nFee">—</b></div>
      <div class="stat"><span>利润</span><b id="nProfit">—</b></div>
      <div class="stat"><span>利率</span><b id="nRate">—</b></div>
    </div>
  </div>
</div>
<script>
// Real chances only. Empty until EPL feed has a rate > 0.
const chances = [];
let cur = null;
function fee(spend, p) { return spend * 0.05 * p * (1 - p); }
function paint(from) {
  if (!cur) return;
  const O = cur.odds, p = cur.ask, maxS = cur.depth;
  let D, S;
  if (from === "S") { S = +inpS.value || 0; D = O ? S / O : 0; if (document.activeElement !== inpD) inpD.value = D ? D.toFixed(1) : ""; }
  else { D = +inpD.value || 0; S = D * O; if (document.activeElement !== inpS) inpS.value = S ? S.toFixed(1) : ""; }
  const spend = S * p, f = fee(spend, p), cost = D + spend + f, profit = S - cost;
  const rate = cost ? profit / cost * 100 : 0;
  nCost.textContent = cost.toFixed(1);
  nFee.textContent = f.toFixed(1);
  nProfit.textContent = profit.toFixed(1);
  nRate.textContent = rate.toFixed(2) + "%";
  const over = S > maxS + 0.05;
  boxS.classList.toggle("over", over);
  warn.textContent = over ? "买多了，这边可能买不全" : "";
}
function show(c) {
  cur = c;
  empty.classList.add("hidden");
  card.classList.remove("hidden");
  match.textContent = c.match;
  kick.textContent = c.kick;
  labD.textContent = "庄买" + c.side;
  labS.textContent = "PM 买" + c.side + "不中";
  const S = c.depth, D = S / c.odds;
  inpD.value = D.toFixed(1);
  inpS.value = S.toFixed(1);
  paint();
}
inpD.oninput = () => paint("D");
inpS.oninput = () => paint("S");
const real = chances.filter(c => c.rate > 0);
if (real[0]) show(real[0]);
</script>
</body>
</html>
